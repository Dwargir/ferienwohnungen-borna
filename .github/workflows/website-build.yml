# Baut die Website für den Webspace des Kunden (Hetzner, ohne Vercel).
# Ergebnis: Download "website-dist" unter Actions -> Lauf -> Artifacts.
# Daraus macht ./paket.sh <ordner> das Kundenpaket mit Einrichtungscode (lokal, damit der Code nie im Log steht).
name: Website bauen

on:
  push:
    branches: [main, ueberarbeitung]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Admin-Daten leeren (keine Passwörter im Download)
        run: rm -rf dist/admin/daten/pw.php dist/admin/config.php
      - uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: dist
          include-hidden-files: true
          retention-days: 30
      - name: Fertige Seite im Zweig "webspace-build" ablegen
        run: |
          cd dist
          git init -q -b webspace-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Fertige Website (aus ${GITHUB_SHA::7})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" webspace-build
